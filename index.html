<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 옵션 필터 프로토타입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y7z8y20do8");
  </script>
  <style>
    :root { --green: #03c75a; --ink: #17211b; --muted: #68736d; --line: #e4e9e5; --paper: #fff; --soft: #f4f7f5; --coral: #ef6255; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 10%, #f6fbf7 0, #dfe9e2 45%, #cbd9cf 100%); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100%, 430px); height: min(900px, 100vh); min-height: 700px; margin: auto; background: var(--paper); position: relative; overflow: hidden; box-shadow: 0 24px 70px rgba(26,48,35,.2); }
    .map-side { position: absolute; inset: 0; background: #d9eadb; }
    #map { width: 100%; height: 100%; }
    .map-overlay { position: absolute; z-index: 500; inset: 16px 16px auto; pointer-events: none; }
    .map-header { position: fixed; z-index: 2000; top: 58px; left: 50%; width: min(406px, calc(100vw - 24px)); transform: translateX(-50%); isolation: isolate; pointer-events: auto !important; }
    .top-search { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid rgba(0,0,0,.06); border-radius: 14px; background: rgba(255,255,255,.97); box-shadow: 0 8px 22px rgba(26,48,35,.14); }
    .top-search-icon { color: var(--green); font-size: 18px; line-height: 1; }
    .top-search input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }
    .top-search input::placeholder { color: var(--muted); font-weight: 500; }
    .top-search button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--soft); color: var(--muted); line-height: 1; }
    .quick-filters { display: flex; flex-wrap: nowrap; gap: 7px; width: 100%; margin-top: 8px; padding: 1px 2px 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; cursor: grab; }
    .quick-filters:active { cursor: grabbing; }
    .quick-filters::-webkit-scrollbar { display: none; }
    .quick-filter { flex: 0 0 auto; padding: 7px 11px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.96); color: var(--muted); box-shadow: 0 4px 12px rgba(26,48,35,.1); font-size: 11px; white-space: nowrap; touch-action: manipulation; pointer-events: auto !important; }
    .quick-filter.active { border-color: var(--green); background: var(--green); color: #fff; font-weight: 700; }
    .brand { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.94); box-shadow: 0 8px 24px rgba(26,48,35,.12); font-weight: 800; pointer-events: auto; }
    .brand-mark { width: 24px; height: 24px; border-radius: 8px 8px 8px 2px; background: var(--green); display: grid; place-items: center; color: #fff; font-size: 13px; }
    .map-note { margin-top: 10px; width: max-content; max-width: 100%; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.84); color: var(--muted); font-size: 12px; }
    .leaflet-popup { margin-bottom: 12px; }
    .leaflet-popup-content-wrapper { width: min(250px, calc(100vw - 48px)); border-radius: 16px; box-shadow: 0 10px 26px rgba(26,48,35,.2); }
    .leaflet-popup-content { width: auto !important; margin: 12px 14px; font-weight: 700; line-height: 1.45; }
    .place-popup-options { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .place-marker { width: 22px; height: 22px; border: 3px solid #fff; border-radius: 50% 50% 50% 0; background: #7c8a82; box-shadow: 0 2px 6px rgba(26,48,35,.3); transform: rotate(-45deg); }
    .place-marker.selected { background: var(--green); transform: scale(1.2) rotate(-45deg); }
    .place-marker.partial { background: var(--coral); }
    .place-marker.partial.selected { background: #d94d43; }
    .panel { position: absolute; z-index: 600; inset: auto 0 0; max-height: 74%; padding: 14px 18px 30px; overflow: auto; background: rgba(255,255,255,.98); border-radius: 26px 26px 0 0; box-shadow: 0 -14px 34px rgba(26,48,35,.16); transform: translateY(0); transition: height .18s ease, transform .28s ease; }
    .panel.browse { height: 240px; max-height: 412px; }
    .panel.hidden { z-index: 1100; transform: translateY(50%); }
    .panel-handle { width: 42px; height: 5px; border-radius: 8px; margin: -9px auto 17px; background: #d4ded7; cursor: grab; touch-action: none; }
    .panel-handle:active { cursor: grabbing; }
    .screen { display: none; }
    .screen.active { display: block; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font: 700 12px 'Outfit', sans-serif; letter-spacing: 0; text-transform: uppercase; }
    h1 { margin: 0; font-size: 28px; line-height: 1.18; letter-spacing: 0; }
    .intro { margin: 10px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    #browseScreen > .intro { margin: 4px 0 10px; }
    .search { display: flex; gap: 8px; margin-bottom: 14px; }
    .search input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
    .search input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(3,199,90,.12); }
    .reset { border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 0 13px; color: var(--muted); white-space: nowrap; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 17px 0 10px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .count { color: var(--muted); font-size: 12px; }
    .add-condition { border: 0; padding: 0; background: transparent; color: var(--green); font-size: 12px; font-weight: 700; }
    #addCondition { padding-bottom: 9px; font-size: 16px; }
    .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .filters:not(.expanded) .filter:not(.active) { display: none; }
    .filter { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--muted); text-align: left; transition: .18s ease; }
    .filter:hover { border-color: #9bd9b5; }
    .filter.active { border-color: var(--green); background: #edfbf2; color: #08783a; font-weight: 700; }
    .filter-state { width: 28px; height: 18px; border-radius: 20px; background: #d9e0dc; position: relative; flex: 0 0 auto; }
    .filter-state::after { content: ''; position: absolute; width: 14px; height: 14px; top: 2px; left: 2px; border-radius: 50%; background: #fff; transition: .18s ease; box-shadow: 0 1px 3px #0002; }
    .filter.active .filter-state { background: var(--green); }
    .filter.active .filter-state::after { left: 12px; }
    .results-meta { padding: 14px 0 5px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    .results-meta strong { color: var(--green); }
    .result-group { margin-top: 16px; }
    .result-group h3 { display: flex; justify-content: space-between; margin: 0 0 9px; font-size: 13px; color: var(--muted); }
    .result-group h3 span { color: var(--green); }
    .result-group.partial h3 span { color: var(--coral); }
    .cards { display: grid; gap: 9px; }
    .place-card { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: #fff; text-align: left; transition: .18s ease; }
    .place-card:hover, .place-card.selected { border-color: var(--green); background: #f8fdf9; transform: translateY(-1px); }
    .place-card img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--soft); }
    .place-name { margin: 0 0 3px; font-size: 14px; font-weight: 700; }
    .place-sub { margin: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .place-score { margin: 3px 0 0; color: #e6a12d; font-size: 11px; font-weight: 700; }
    .place-menu { margin: 3px 0 0; color: #44514a; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .place-review { margin: 5px 0 0; padding: 4px 7px; border: 1px solid #edf2f7; border-radius: 6px; background: #f8fafc; color: #64748b; font-size: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 1; line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .tag { padding: 3px 6px; border-radius: 5px; background: var(--soft); color: var(--muted); font-size: 10px; }
    .tag.on { background: #e2f8e9; color: #08783a; }
    .tag.missing { background: #f1f3f5; color: #89929a; }
    .empty { padding: 28px 14px; border: 1px dashed #cbd8ce; border-radius: 13px; color: var(--muted); text-align: center; font-size: 13px; }
    .back-button { border: 0; background: transparent; padding: 0 0 12px; color: var(--muted); font-size: 13px; }
    .situation-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 24px; }
    .situation { min-height: 92px; padding: 12px 7px; border: 1px solid var(--line); border-radius: 15px; background: #fff; color: var(--ink); font-weight: 700; }
    .situation strong { display: block; margin-bottom: 7px; font-size: 25px; }
    .situation:hover { border-color: var(--green); background: #edfbf2; }
    .screen-title { margin: 0; font-size: 21px; }
    .screen-copy { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .preset-section { margin: 2px 0 32px; }
    .preset-section .section-head { margin-top: 0; }
    .preset-chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .preset-chips::-webkit-scrollbar { display: none; }
    .preset-chip { flex: 0 0 auto; padding: 9px 13px; border: 1px solid #cfe8d8; border-radius: 20px; background: #f3fbf5; color: #08783a; font-size: 12px; font-weight: 700; }
    .preset-chip:hover, .preset-chip.active { border-color: var(--green); background: var(--green); color: #fff; }
    .preset-sheet { position: fixed; z-index: 1400; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(23,33,27,.22); }
    .preset-sheet.open { display: flex; }
    .preset-dialog { width: min(430px, 100%); padding: 24px 20px 28px; border-radius: 24px 24px 0 0; background: #fff; box-shadow: 0 -12px 35px rgba(26,48,35,.18); }
    .preset-dialog-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .preset-dialog h2 { margin: 0; font-size: 20px; }
    .preset-dialog p { margin: 7px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .preset-options { display: grid; gap: 8px; margin-bottom: 18px; }
    .preset-option { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border-radius: 11px; background: var(--soft); color: var(--ink); font-size: 13px; }
    .preset-option input { width: 17px; height: 17px; accent-color: var(--green); }
    .preset-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
    .preset-actions button { padding: 12px; border-radius: 11px; font-weight: 700; }
    .preset-edit { border: 1px solid var(--line); background: #fff; color: var(--muted); }
    .preset-apply { border: 1px solid var(--green); background: var(--green); color: #fff; }
    .detail { position: fixed; z-index: 1200; left: 50%; bottom: 18px; width: min(410px, calc(100vw - 20px)); max-height: 66vh; overflow-y: auto; padding: 0 18px 18px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.98); box-shadow: 0 16px 38px rgba(26,48,35,.22); display: none; transform: translateX(-50%); }
    .detail.open { display: block; }
    .detail-image { width: calc(100% + 36px); height: 180px; margin-left: -18px; object-fit: cover; background: var(--soft); }
    .detail-body { padding-top: 16px; }
    .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail h2 { margin: 0; font-size: 17px; }
    .detail-info { margin-top: 8px !important; color: #e6a12d !important; font-size: 13px !important; font-weight: 800; }
    .close { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--soft); color: var(--muted); }
    .detail p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .detail-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 14px; }
    .detail-options .tag { padding: 9px 10px; border-radius: 9px; font-size: 11px; }
    .detail-actions { display: flex; gap: 8px; margin-top: 16px; }
    .detail-review { margin-top: 12px !important; padding: 10px 12px; border-left: 3px solid var(--green); border-radius: 0 8px 8px 0; background: #f8fafc; color: #44514a !important; }
    .detail-contact { display: grid; gap: 5px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .detail-category { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 600; text-align: right; }
    .final-select { flex: 1; padding: 11px 14px; border: 1px solid var(--green); border-radius: 11px; background: var(--green); color: #fff; font-weight: 700; }
    .final-select.selected { border-color: #08783a; background: #e2f8e9; color: #08783a; }
    @media (max-width: 430px) {
      body { background: var(--paper); }
      .app { width: 100%; height: 100vh; min-height: 640px; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="map-side" aria-label="장소 지도">
      <div id="map"></div>
      <div class="map-overlay">
        <div class="map-note">Leaflet + OpenStreetMap · 수집된 실제 좌표로 표시됩니다</div>
      </div>
      <div class="map-header">
        <label class="top-search" aria-label="장소 검색">
          <span class="top-search-icon">⌕</span>
          <input id="topSearch" type="search" value="건대입구 맛집" placeholder="장소 검색">
          <button id="clearTopSearch" type="button" aria-label="검색어 지우기">×</button>
        </label>
        <div class="quick-filters" id="quickFilters" aria-label="빠른 옵션 필터"></div>
      </div>
    </section>
    <section class="panel browse" id="panel">
      <div class="panel-handle" id="panelHandle" role="button" tabindex="0" aria-label="조건 패널 접기 또는 펼치기"></div>
      <div class="screen" id="situationScreen">
        <p class="eyebrow">Situation Finder</p>
        <h1>어떤 상황에서<br>방문하시나요?</h1>
        <p class="intro">상황에 맞는 기본 조건을 먼저 적용해볼게요.</p>
        <div class="situation-grid">
          <button class="situation" data-situation="family" type="button"><strong>👨‍👩‍👧</strong>가족 모임</button>
          <button class="situation" data-situation="friends" type="button"><strong>👫</strong>친구 모임</button>
          <button class="situation" data-situation="dinner" type="button"><strong>🍻</strong>회식</button>
        </div>
      </div>
      <div class="screen active" id="browseScreen">
        <p class="eyebrow" id="situationLabel">통합 탐색</p>
        <h2>검색 결과에서 조건을 더해보세요</h2>
        <p class="intro">방문 상황이나 편의 옵션을 선택하면 장소를 좁혀볼 수 있어요.</p>
        <section class="preset-section" aria-labelledby="presetHeading">
          <div class="section-head"><h2 id="presetHeading">방문 상황으로 빠르게 찾기</h2><span class="count">preset</span></div>
          <div class="preset-chips" id="presetChips"></div>
        </section>
        <div class="section-head"><h2>편의 옵션</h2><span class="count" id="dataCount">불러오는 중...</span></div>
        <button class="add-condition" id="addCondition" type="button">+ 조건 추가</button>
        <div class="filters" id="filters"></div>
        <div class="results-meta" id="summary">데이터를 불러오는 중...</div>
        <section class="result-group"><h3>조건을 모두 만족해요 <span id="fullCount">0곳</span></h3><div class="cards" id="fullResults"></div></section>
        <section class="result-group partial"><h3>일부 조건이 맞아요 <span id="partialCount">0곳</span></h3><div class="cards" id="partialResults"></div></section>
      </div>
    </section>
  </main>
  <aside class="detail" id="detail" aria-live="polite">
    <img class="detail-image" id="detailImage" src="" alt="장소 대표 사진">
    <div class="detail-body"><div class="detail-top"><h2 id="detailName"></h2><span class="detail-category" id="detailCategory"></span><button class="close" id="closeDetail" type="button" aria-label="상세 닫기">×</button></div>
    <p class="detail-info" id="detailInfo"></p><p class="detail-review" id="detailReview"></p><div class="detail-contact"><span id="detailMenu"></span><span id="detailAddress"></span><span id="detailPhone"></span></div><div class="detail-options" id="detailOptions"></div>
    <div class="detail-actions"><button class="final-select" id="finalSelect" type="button">최종 장소로 선택</button></div>
    </div>
  </aside>
  <aside class="preset-sheet" id="presetSheet" aria-hidden="true">
    <section class="preset-dialog" role="dialog" aria-modal="true" aria-labelledby="presetTitle">
      <div class="preset-dialog-top"><div><h2 id="presetTitle"></h2><p>자주 확인하는 조건이에요.</p></div><button class="close" id="closePreset" type="button" aria-label="preset 닫기">×</button></div>
      <div class="preset-options" id="presetOptions"></div>
      <div class="preset-actions"><button class="preset-edit" id="editPreset" type="button">조건 수정</button><button class="preset-apply" id="applyPreset" type="button">조건 적용하기</button></div>
    </section>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DATA_URL = './places_data_02.json';
    const LOG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxxxeS9qjXCX7MvzAqoZ2kZGk8PkfjgIWO1beC54Ed56Jx5vTijzlE888ChsHbHplzSjQ/exec';
    const mapCenter = [37.5408, 127.0693];
    const placeDetails = {
      'Makke': ['자연산 막회 (소) 38,000원', 4.82, 890, '회가 신선하고 특제 초장 양념에 비벼 먹는 야채 조합이 대화하며 술 한잔 곁들이기 최고예요.'],
      '꽃삼뚜껑 구의역점': ['솥뚜껑 꽃삼겹 (180g) 15,000원', 4.79, 1420, '솥뚜껑에 김치와 미나리를 같이 구워 먹어서 질리지 않고, 주차와 좌석이 넉넉해 가족 식사에 딱입니다.'],
      '신선술집 도원 건대 본점': ['도원 소고기 전골 24,900원', 4.88, 2150, '프라이빗한 개별룸이 잘 구비되어 있어서 시끄럽지 않게 회식이나 모임 가지기에 안성맞춤이에요.'],
      '미도인 건대': ['미도인 가정식 스테이크 16,800원', 4.74, 3280, '스테이크가 부드럽고 한상 차림이 정갈해서 친구들이랑 분위기 내며 대화 나누기 좋았어요.'],
      '우동키노야 건대점': ['붓가케 우동 9,500원', 4.68, 640, '직접 뽑는 자가제면이라 면발의 쫄깃함이 남다르고 혼밥이나 조용히 식사하기 편한 분위기예요.'],
      '탐라육해 건대본점': ['한우 육회&딱새우 세트 39,000원', 4.81, 1180, '제주 딱새우의 단맛과 신선한 육회 퀄리티가 훌륭해서 친구 모임 술자리로 실패가 없는 곳입니다.'],
      '희가덕 손만두 건대점': ['수제 고기손만두 (8개) 7,000원', 4.62, 480, '얇은 피 안에 육즙 가득한 만두소가 꽉 차 있어 가볍고 든든하게 먹기 좋은 숨은 로컬 맛집입니다.'],
      '건대 고기굽는놈 본점': ['당일작업 숯불 소갈비살 16,000원', 4.87, 4210, '참숯 향 배인 소갈비살이 일품이며, 직원분들이 친절하고 매장이 넓어 단체 회식으로 자주 찾아요.'],
      '한우짝갈비살': ['한우 짝갈비살 (100g) 19,000원', 4.78, 920, '가성비 뛰어난 한우 짝갈비살의 마블링과 육즙이 최고라 가족 모임 식사로 늘 만족스럽습니다.'],
      '고이장': ['고이장 수육&미나리무침 26,000원', 4.85, 530, '부드러운 수육과 향긋한 미나리무침 안주가 훌륭하고, 아늑한 분위기에서 조용히 이야기하기 좋습니다.'],
      '띠목훠궈 건대점': ['무한리필 훠궈 (1인) 19,800원', 4.69, 1340, '신선한 고기와 다양한 채소, 소스바를 무제한으로 마음껏 즐길 수 있는 건대 최고의 가성비 훠궈집입니다.'],
      '옥화정': ['짚불숙성 짚불삼겹살 16,000원', 4.86, 1650, '짚불 훈연 향이 입혀진 도톰한 삼겹살이 예술이고 개별룸이 있어 쾌적한 회식이 가능해요.'],
      '사토규카츠 건대본점': ['살치살 규카츠 정식 18,000원', 4.84, 1890, '개인 화로에 원하는 굽기로 구워 먹는 재미가 있고 겉바속촉 고기 육즙이 아주 풍부합니다.'],
      '성수완당': ['성수완당면 (온면) 10,000원', 4.83, 2740, '바삭한 가지튀김 토핑과 맑고 깊은 완당 국물이 일품이라 줄 서서 먹는 보람이 있는 곳입니다.'],
      '바인': ['감바스 알 아히요 18,000원', 4.91, 420, '조용하고 감각적인 음악이 흐르는 와인바로, 대화에 집중하기 좋은 편안한 좌석이 매력적이에요.'],
      '쿠우쿠우 블루레일 건대직영점': ['프리미엄 회전초밥 (접시당) 1,500원~', 4.72, 2980, '다양한 종류의 초밥이 신선하게 관리되고, 유아의자와 넓은 좌석이 완비되어 가족 외식 장소로 최고입니다.'],
      '민지슈퍼 건대본점': ['매콤 차돌 국물떡볶이 19,000원', 4.79, 870, '레트로한 감성 포차 분위기에 푸짐한 안주 퀄리티가 좋아 친구들과 늦은 시간까지 부담 없이 즐기기 좋습니다.'],
      '김창훈포차': ['곱도리탕 (순살) 28,000원', 4.82, 1520, '진하고 매콤달콤한 곱도리탕에 소주 한잔 곁들이기 좋고, 단체석과 룸이 마련되어 있어 모임 장소로 좋아요.'],
      '난바다스시': ['특선 모듬초밥 (12p) 17,000원', 4.75, 780, '네타가 두툼하고 밥 양과 간이 적당해서 한 판 뚝딱 비우게 되는 실속 있는 초밥 맛집입니다.'],
      '코시 건대점': ['수제 덴뿌라 우동 11,000원', 4.81, 910, '바삭한 튀김과 깔끔하고 깊은 우동 국물이 훌륭하며, 유아의자와 전용 주차가 가능해 외식하기 편리합니다.'],
      '탄토탄토': ['트러플 버섯 크림 뇨끼 17,000원', 4.89, 1130, '진한 트러플 풍미와 쫀득한 뇨끼의 조화가 예술이며, 분위기가 감성적이어서 친구 모임이나 데이트로 추천해요.'],
      '굴림샤브&콩국수': ['굴림만두 소고기 샤브 14,000원', 4.77, 860, '피 없는 굴림만두와 담백하고 시원한 샤브 육수가 어우러져 남녀노소 가족 모두 건강하게 즐길 수 있습니다.']
    };
    const optionLabels = { parking: '주차', high_chair: '유아 의자', group_seats: '단체석', room: '룸', reservation: '예약', conversation: '대화하기 좋은', comfortable_seat: '편안한 좌석', pet_friendly: '반려동물', liquor_available: '콜키지 가능', late_night_early: '심야영업' };
    const situations = {
      family: { label: '가족 모임', options: ['parking', 'group_seats', 'reservation', 'high_chair'] },
      friends: { label: '친구 모임', options: ['reservation', 'conversation', 'comfortable_seat'] },
      dinner: { label: '회식', options: ['group_seats', 'room', 'reservation'] }
    };
    const state = {
      places: [], activeOptions: new Set(), query: '', markers: new Map(), selectedId: null, situation: null,
      finalSelectedId: null, sessionId: crypto.randomUUID ? crypto.randomUUID() : `session-${Date.now()}`,
      sessionStartedAt: Date.now(), detailOpenedAt: null, detailViewCount: 0, detailDwellSeconds: 0,
      zeroResultsOccurred: false, zeroRecoveryActions: [], tagToggleLogs: []
    };
    const map = L.map('map', { zoomControl: false }).setView(mapCenter, 15);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
    const getPosition = (place) => {
      if (Number.isFinite(Number(place.latitude)) && Number.isFinite(Number(place.longitude))) return [Number(place.latitude), Number(place.longitude)];
      return mapCenter;
    };
    const matchScore = (place) => [...state.activeOptions].filter((key) => place.parsed_options?.[key] === true).length;
    const visiblePlaces = () => state.places.filter((place) => {
      const haystack = `${place.name} ${place.category} ${place.address}`.toLowerCase();
      return !state.query || haystack.includes(state.query.toLowerCase());
    });
    const groups = () => {
      const places = visiblePlaces();
      if (!state.activeOptions.size) return { full: places, partial: [] };
      return { full: places.filter((place) => matchScore(place) === state.activeOptions.size), partial: places.filter((place) => { const score = matchScore(place); return score > 0 && score < state.activeOptions.size; }) };
    };

    function renderFilters() {
      const keys = [...new Set(state.places.flatMap((place) => Object.keys(place.parsed_options || {})))];
      $('filters').innerHTML = keys.map((key) => `<button class="filter ${state.activeOptions.has(key) ? 'active' : ''}" data-option="${escapeHtml(key)}" type="button"><span>${escapeHtml(optionLabels[key] || key)}</span><span class="filter-state" aria-hidden="true"></span></button>`).join('');
      $('quickFilters').innerHTML = keys.map((key) => `<button class="quick-filter ${state.activeOptions.has(key) ? 'active' : ''}" data-quick-option="${escapeHtml(key)}" onclick="toggleQuickOption('${escapeHtml(key)}')" type="button">${escapeHtml(optionLabels[key] || key)}</button>`).join('');
      $('filters').querySelectorAll('[data-option]').forEach((button) => button.addEventListener('click', () => {
        const key = button.dataset.option;
        const enabled = !state.activeOptions.has(key);
        enabled ? state.activeOptions.add(key) : state.activeOptions.delete(key);
        state.tagToggleLogs.push({ tag: key, enabled, timestamp: new Date().toISOString() });
        render();
      }));
    }

    function renderPresets() {
      $('presetChips').innerHTML = Object.entries(situations).map(([key, situation]) => `<button class="preset-chip ${state.situation === key ? 'active' : ''}" data-preset="${key}" type="button">${escapeHtml(situation.label)}</button>`).join('');
      $('presetChips').querySelectorAll('[data-preset]').forEach((button) => button.addEventListener('click', () => openPreset(button.dataset.preset)));
    }

    function openPreset(key) {
      const situation = situations[key];
      state.situation = key;
      state.activeOptions = new Set(situation.options);
      $('presetTitle').textContent = situation.label;
      $('presetOptions').innerHTML = situation.options.map((option) => `<label class="preset-option"><input type="checkbox" data-preset-option="${option}" ${state.activeOptions.has(option) ? 'checked' : ''}>${escapeHtml(optionLabels[option] || option)} 가능</label>`).join('');
      $('presetOptions').querySelectorAll('[data-preset-option]').forEach((input) => input.addEventListener('change', () => {
        input.checked ? state.activeOptions.add(input.dataset.presetOption) : state.activeOptions.delete(input.dataset.presetOption);
        render();
      }));
      $('presetSheet').classList.add('open');
      $('presetSheet').setAttribute('aria-hidden', 'false');
      render();
    }

    function closePreset() {
      $('presetSheet').classList.remove('open');
      $('presetSheet').setAttribute('aria-hidden', 'true');
    }

    let chipDragStart = null;
    let chipDragged = false;
    $('quickFilters').addEventListener('pointerdown', (event) => {
      chipDragStart = { x: event.clientX, scrollLeft: $('quickFilters').scrollLeft };
      chipDragged = false;
    });
    $('quickFilters').addEventListener('pointermove', (event) => {
      if (!chipDragStart) return;
      if (Math.abs(event.clientX - chipDragStart.x) > 5) chipDragged = true;
      $('quickFilters').scrollLeft = chipDragStart.scrollLeft - (event.clientX - chipDragStart.x);
    });
    function toggleQuickOption(key) {
      if (chipDragged) { chipDragStart = null; return; }
      const enabled = !state.activeOptions.has(key);
      enabled ? state.activeOptions.add(key) : state.activeOptions.delete(key);
      state.tagToggleLogs.push({ tag: key, enabled, timestamp: new Date().toISOString(), source: 'quick-filter' });
      render();
      chipDragStart = null;
    }
    ['pointercancel', 'lostpointercapture'].forEach((eventName) => $('quickFilters').addEventListener(eventName, () => { chipDragStart = null; }));

    function placeCard(place, isPartial) {
      const activeTags = [...state.activeOptions].map((key) => `<span class="tag ${place.parsed_options?.[key] === true ? 'on' : 'missing'}">${escapeHtml(optionLabels[key] || key)} ${place.parsed_options?.[key] === true ? '가능' : '미확인'}</span>`).join('');
      const rating = Number.isFinite(Number(place.rating)) ? `★ ${Number(place.rating).toFixed(2)}` : '';
      const reviews = Number.isFinite(Number(place.review_count)) ? ` · 리뷰 ${Number(place.review_count).toLocaleString()}개` : '';
      return `<button class="place-card ${state.selectedId === place._id ? 'selected' : ''}" data-place-id="${place._id}" type="button"><img src="${escapeHtml(place.image_url || '')}" alt=""><div><p class="place-name">${escapeHtml(place.name || '이름 없음')}</p><p class="place-sub">${escapeHtml(place.category || '업종 미상')} · ${escapeHtml(place.address || '주소 미상')}</p>${rating ? `<p class="place-score">${rating}${reviews}</p>` : ''}${place.signature_menu ? `<p class="place-menu">🍴 ${escapeHtml(place.signature_menu)}</p>` : ''}${place.highlight_review ? `<p class="place-review">“${escapeHtml(place.highlight_review)}”</p>` : ''}<div class="tags">${activeTags || '<span class="tag on">전체 장소</span>'}${isPartial ? '<span class="tag missing">일부 조건</span>' : ''}</div></div></button>`;
    }

    function renderCards(id, places, partial) {
      $(id).innerHTML = places.length ? places.map((place) => placeCard(place, partial)).join('') : `<div class="empty">${partial ? '일부 조건에 맞는 장소가 없습니다.' : '조건에 맞는 곳이 없어요.'}<br><button class="add-condition" type="button" data-empty-action>조건 다시 수정</button></div>`;
      $(id).querySelectorAll('[data-place-id]').forEach((card) => card.addEventListener('click', () => selectPlace(Number(card.dataset.placeId))));
      $(id).querySelector('[data-empty-action]')?.addEventListener('click', () => {
        state.zeroRecoveryActions.push({ action: '조건 다시 수정', timestamp: new Date().toISOString() });
        $('filters').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    const placeOptionsMarkup = (place) => Object.entries(place.parsed_options || {}).map(([key, value]) => `<span class="tag ${value === true ? 'on' : 'missing'}">${escapeHtml(optionLabels[key] || key)}</span>`).join('');

    function renderMarkers(fullPlaces, partialPlaces) {
      state.markers.forEach((marker) => marker.remove());
      state.markers.clear();
      [...fullPlaces.map((place) => ({ place, isPartial: false })), ...partialPlaces.map((place) => ({ place, isPartial: true }))].forEach(({ place, isPartial }) => {
        const markerClass = `place-marker ${isPartial ? 'partial' : ''} ${state.selectedId === place._id ? 'selected' : ''}`;
        const popupLabel = isPartial ? '<br><small>일부 조건 일치</small>' : '';
        const icon = L.divIcon({ className: '', html: `<div class="${markerClass}"></div>`, iconSize: [22, 22], iconAnchor: [11, 22], popupAnchor: [0, -22] });
        const marker = L.marker(getPosition(place), { icon }).addTo(map).bindPopup(`<strong>${escapeHtml(place.name)}</strong>${popupLabel}<br>${escapeHtml(place.category || '')}`);
        marker.on('click', () => selectPlace(place._id));
        state.markers.set(place._id, marker);
      });
    }

    function selectPlace(id) {
      const place = state.places.find((item) => item._id === id);
      if (!place) return;
      closeDetail(false);
      state.selectedId = id;
      state.detailOpenedAt = Date.now();
      state.detailViewCount += 1;
      $('panel').classList.add('hidden');
      const position = getPosition(place);
      map.setView(position, 16, { animate: true });
      $('detailImage').src = place.image_url || '';
      $('detailImage').alt = `${place.name || '장소'} 대표 사진`;
      $('detailName').textContent = place.name || '이름 없음';
      $('detailCategory').textContent = place.category || '업종 미상';
      const detailRating = Number.isFinite(Number(place.rating)) ? `★ ${Number(place.rating).toFixed(2)}` : '';
      const detailReviews = Number.isFinite(Number(place.review_count)) ? ` · 리뷰 ${Number(place.review_count).toLocaleString()}개` : '';
      $('detailInfo').textContent = `${detailRating}${detailReviews}`;
      $('detailReview').textContent = place.highlight_review ? `“${place.highlight_review}”` : '';
      $('detailReview').style.display = place.highlight_review ? 'block' : 'none';
      $('detailMenu').textContent = place.signature_menu ? `대표 메뉴 · ${place.signature_menu}` : '';
      $('detailAddress').textContent = place.address ? `주소 · ${place.address}` : '';
      $('detailPhone').textContent = place.phone ? `전화 · ${place.phone}` : '';
      $('detailOptions').innerHTML = placeOptionsMarkup(place);
      $('finalSelect').textContent = state.finalSelectedId === id ? '최종 선택됨' : '최종 장소로 선택';
      $('finalSelect').classList.toggle('selected', state.finalSelectedId === id);
      $('detail').classList.add('open');
      render();
      state.markers.get(id)?.openPopup();
    }

    function closeDetail(reopenPanel = true) {
      if (state.detailOpenedAt !== null) {
        state.detailDwellSeconds += (Date.now() - state.detailOpenedAt) / 1000;
        state.detailOpenedAt = null;
      }
      $('detail').classList.remove('open');
      if (reopenPanel) $('panel').classList.remove('hidden');
    }

    function buildLogPayload() {
      const place = state.places.find((item) => item._id === state.finalSelectedId);
      return {
        timestamp: new Date().toISOString(),
        sessionId: state.sessionId,
        selectedPreset: state.situation ? situations[state.situation]?.label || state.situation : '',
        finalSelectedPlace: place?.name || '',
        totalDurationSec: Math.round((Date.now() - state.sessionStartedAt) / 1000),
        detailViewCount: state.detailViewCount,
        detailStayDurationSec: Math.round(state.detailDwellSeconds + (state.detailOpenedAt ? (Date.now() - state.detailOpenedAt) / 1000 : 0)),
        zeroResultTriggered: state.zeroResultsOccurred,
        zeroResultRecoveryAction: JSON.stringify(state.zeroRecoveryActions),
        tagToggleLogs: state.tagToggleLogs
      };
    }

    function sendLog(payload) {
      if (!LOG_ENDPOINT) return;
      const body = JSON.stringify(payload);
      fetch(LOG_ENDPOINT, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {
        if (navigator.sendBeacon) navigator.sendBeacon(LOG_ENDPOINT, new Blob([body], { type: 'text/plain;charset=utf-8' }));
      });
    }

    function finalizePlace() {
      if (state.selectedId === null) return;
      state.finalSelectedId = state.selectedId;
      const place = state.places.find((item) => item._id === state.finalSelectedId);
      $('finalSelect').textContent = '최종 선택됨';
      $('finalSelect').classList.add('selected');
      sendLog(buildLogPayload());
      $('detailInfo').textContent = `${place.name || '이름 없음'}을(를) 최종 장소로 선택했습니다.`;
    }

    function showBrowse(situationKey) {
      const situation = situations[situationKey];
      state.situation = situationKey;
      state.activeOptions = new Set(situation.options);
      $('panel').classList.remove('hidden');
      $('situationLabel').textContent = `${situation.label} · 통합 탐색`;
      $('situationScreen').classList.remove('active');
      $('browseScreen').classList.add('active');
      $('panel').classList.add('browse');
      render();
    }

    function showSituation() {
      state.situation = null;
      state.activeOptions.clear();
      $('panel').classList.remove('hidden');
      $('browseScreen').classList.remove('active');
      $('situationScreen').classList.add('active');
      $('panel').classList.remove('browse');
      $('detail').classList.remove('open');
    }

    function render() {
      renderFilters();
      renderPresets();
      const { full, partial } = groups();
      if (state.activeOptions.size && full.length === 0) state.zeroResultsOccurred = true;
      renderCards('fullResults', full, false);
      renderCards('partialResults', partial, true);
      renderMarkers(full, partial);
      $('dataCount').textContent = `${state.places.length}개 장소`;
      $('fullCount').textContent = `${full.length}곳`;
      $('partialCount').textContent = `${partial.length}곳`;
      $('summary').innerHTML = state.activeOptions.size ? `<strong>${full.length}곳</strong>이 모든 선택 조건과 일치합니다.` : `<strong>${full.length}곳</strong>의 전체 장소를 표시하고 있습니다.`;
    }

    let panelDragStartY = null;
    let panelDragStartHeight = null;
    let panelWasDragged = false;
    let panelSwipeStartY = null;
    let panelSwipeStartHeight = null;
    let panelSwipeTarget = null;
    const getPanelBaseHeight = () => Math.min(240, $('panel').parentElement.clientHeight * .7);
    const setPanelHeight = (height) => {
      const appHeight = $('panel').parentElement.clientHeight;
      const minHeight = getPanelBaseHeight();
      const maxHeight = Math.min(412, appHeight * .7);
      $('panel').style.height = `${Math.min(maxHeight, Math.max(minHeight, height))}px`;
    };
    const togglePanelSnap = () => {
      const panel = $('panel');
      const maxHeight = Math.min(412, panel.parentElement.clientHeight * .7);
      setPanelHeight(panel.offsetHeight <= getPanelBaseHeight() + 1 ? maxHeight : getPanelBaseHeight());
    };
    $('panelHandle').addEventListener('click', () => {
      if (panelWasDragged) {
        panelWasDragged = false;
        return;
      }
      $('panel').classList.toggle('hidden');
    });
    $('panelHandle').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        $('panel').classList.toggle('hidden');
      }
    });
    $('panelHandle').addEventListener('pointerdown', (event) => {
      panelDragStartY = event.clientY;
      panelDragStartHeight = $('panel').offsetHeight;
      panelWasDragged = false;
      $('panel').classList.remove('hidden');
      $('panelHandle').setPointerCapture(event.pointerId);
    });
    $('panelHandle').addEventListener('pointermove', (event) => {
      if (panelDragStartY !== null) {
        if (Math.abs(event.clientY - panelDragStartY) > 8) panelWasDragged = true;
        setPanelHeight(panelDragStartHeight + panelDragStartY - event.clientY);
      }
    });
    $('panelHandle').addEventListener('pointerup', (event) => {
      if (panelDragStartY !== null) setPanelHeight(panelDragStartHeight + panelDragStartY - event.clientY);
      panelDragStartY = null;
      panelDragStartHeight = null;
    });
    $('panelHandle').addEventListener('pointercancel', () => { panelDragStartY = null; panelDragStartHeight = null; panelWasDragged = false; });

    $('panel').addEventListener('pointerdown', (event) => {
      if (event.target.closest('button, input, a, [role="button"]') || event.target === $('panelHandle')) return;
      panelSwipeStartY = event.clientY;
      panelSwipeStartHeight = $('panel').offsetHeight;
      panelSwipeTarget = event.target;
      $('panel').setPointerCapture(event.pointerId);
    });
    $('panel').addEventListener('pointermove', (event) => {
      if (panelSwipeStartY === null) return;
      const deltaY = event.clientY - panelSwipeStartY;
      if (Math.abs(deltaY) <= 40) return;
      setPanelHeight(deltaY < 0 ? $('panel').parentElement.clientHeight * .7 : $('panel').parentElement.clientHeight * .3);
      panelSwipeStartY = null;
      panelSwipeStartHeight = null;
      panelSwipeTarget = null;
    });
    $('panel').addEventListener('pointerup', (event) => {
      if (panelSwipeStartY === null) return;
      const deltaY = event.clientY - panelSwipeStartY;
      if (Math.abs(deltaY) > 40) setPanelHeight(deltaY < 0 ? $('panel').parentElement.clientHeight * .7 : $('panel').parentElement.clientHeight * .3);
      panelSwipeStartY = null;
      panelSwipeStartHeight = null;
      panelSwipeTarget = null;
    });
    $('panel').addEventListener('pointercancel', () => { panelSwipeStartY = null; panelSwipeStartHeight = null; panelSwipeTarget = null; });
    $('panel').addEventListener('click', (event) => {
      if (event.target.closest('button, input, a, [role="button"], .place-card')) return;
      togglePanelSnap();
    });

    $('topSearch').addEventListener('input', (event) => { state.query = event.target.value.trim(); render(); });
    ['touchstart', 'touchmove', 'touchend', 'wheel'].forEach((eventName) => $('quickFilters').addEventListener(eventName, (event) => event.stopPropagation(), { passive: true }));
    $('clearTopSearch').addEventListener('click', () => { state.query = ''; $('topSearch').value = ''; render(); });
    $('closeDetail').addEventListener('click', () => {
      closeDetail();
      state.selectedId = null;
      render();
    });
    $('finalSelect').addEventListener('click', finalizePlace);
    $('closePreset').addEventListener('click', closePreset);
    $('applyPreset').addEventListener('click', closePreset);
    $('editPreset').addEventListener('click', () => {
      closePreset();
      $('filters').classList.add('expanded');
      $('addCondition').textContent = '− 조건 접기';
      $('filters').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    $('addCondition').addEventListener('click', () => {
      $('filters').classList.toggle('expanded');
      $('addCondition').textContent = $('filters').classList.contains('expanded') ? '− 조건 접기' : '+ 조건 추가';
    });
    document.querySelectorAll('[data-situation]').forEach((button) => button.addEventListener('click', () => showBrowse(button.dataset.situation)));

    fetch(DATA_URL).then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }).then((places) => {
      state.places = places.map((place, index) => {
        const details = placeDetails[place.name];
        return { ...place, ...(details ? { signature_menu: details[0], rating: details[1], review_count: details[2], highlight_review: details[3] } : {}), _id: index };
      });
      const coordinates = state.places.map(getPosition);
      if (coordinates.length) map.fitBounds(L.latLngBounds(coordinates), { padding: [28, 28], maxZoom: 15 });
      render();
    }).catch((error) => {
      $('dataCount').textContent = '로드 실패';
      $('summary').textContent = 'JSON을 불러오지 못했습니다. 로컬 서버에서 페이지를 실행해 주세요.';
      console.error('장소 데이터 로딩 실패:', error);
    });
  </script>
</body>
</html>
